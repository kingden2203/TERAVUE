<!doctype html>
<html lang="fil">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TERRAVUE — Radar, Baha at Hangin para sa Pilipinas</title>
  <meta name="description" content="Libreng weather radar, flood risk, hangin at alon para sa mga mangingisda, rider at hiker sa Pilipinas. Walang login.">
  <meta name="theme-color" content="#060b16">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-base="dark">
  <header id="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="#22d3ee" stroke-width="2"/><circle cx="16" cy="16" r="8" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity=".6"/><circle cx="16" cy="16" r="2.5" fill="#22d3ee"/><path d="M16 16 L27 8" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/></svg>
      <div><b>TERRAVUE</b><small data-i18n="tagline"></small></div>
    </div>
    <nav id="modes" aria-label="Mode">
      <button data-act="mode" data-v="general"><span aria-hidden="true">🌐</span><span data-i18n="mode.general"></span></button>
      <button data-act="mode" data-v="motorcycle"><span aria-hidden="true">🏍</span><span data-i18n="mode.motorcycle"></span></button>
      <button data-act="mode" data-v="hiker"><span aria-hidden="true">🥾</span><span data-i18n="mode.hiker"></span></button>
      <button data-act="mode" data-v="fisher"><span aria-hidden="true">🎣</span><span data-i18n="mode.fisher"></span></button>
    </nav>
    <form id="search" role="search">
      <input id="q" type="search" autocomplete="off" data-i18n-ph="search" data-i18n-title="search">
      <ul id="qres" class="suggest" hidden></ul>
    </form>
    <div class="actions">
      <button class="icon" data-act="locate" data-i18n-title="locate">◎</button>
      <button class="icon txt" id="btnLang" data-act="lang">EN</button>
    </div>
  </header>
  <div id="banner" hidden></div>
  <div id="netbar" hidden></div>

  <main>
    <div id="map" role="application" aria-label="Map"></div>

    <aside id="layers" class="panel">
      <h2 data-i18n="layers"></h2>
      <div id="layerList"></div>
      <div id="riskKinds"></div>
      <div id="bases"></div>
      <div id="legend"></div>
      <div id="offline"></div>
      <p class="fine" data-i18n="radarNote"></p>
    </aside>

    <aside id="side" class="panel">
      <div id="tabs" role="tablist">
        <button data-act="tab" data-v="place" class="on"><span data-i18n="tab.place"></span></button>
        <button data-act="tab" data-v="route"><span data-i18n="tab.route"></span></button>
        <button data-act="tab" data-v="alerts"><span data-i18n="tab.alerts"></span><b class="abadge" hidden></b></button>
        <button class="close" data-act="close" aria-label="Close">✕</button>
      </div>
      <section id="tab-place"></section>
      <section id="tab-route" hidden><div id="route-form"></div><div id="route-results"></div></section>
      <section id="tab-alerts" hidden></section>
    </aside>

    <div id="maphint" hidden></div>
    <div id="timeline">
      <button id="tlPlay" data-act="play" aria-label="Play radar">▶</button>
      <input id="tlRange" type="range" min="0" max="0" value="0" aria-label="Radar time">
      <span id="tlLabel"></span>
    </div>
  </main>

  <nav id="bottomnav">
    <button data-act="layers"><span>◧</span><i data-i18n="layers"></i></button>
    <button data-act="tab" data-v="place" class="on"><span>◉</span><i data-i18n="tab.place"></i></button>
    <button data-act="tab" data-v="route"><span>⤳</span><i data-i18n="tab.route"></i></button>
    <button data-act="tab" data-v="alerts"><span>⚠</span><i data-i18n="tab.alerts"></i><b class="abadge" hidden></b></button>
  </nav>
  <div id="nav" hidden>
    <div class="nav-top">
      <div id="nav-arrow" class="nav-arrow"></div>
      <div class="nav-main"><b id="nav-dist"></b><span id="nav-text"></span></div>
      <span id="nav-simtag" class="simtag" hidden data-i18n="navSimTag"></span>
    </div>
    <div id="nav-then" class="nav-then" hidden></div>
    <div id="nav-haz" class="navhaz" hidden></div>
    <div id="nav-rr" class="navrr" hidden></div>
    <div id="nav-gps" class="navrr" hidden></div>
    <div id="nav-arrived" class="nav-arrived" hidden><b data-i18n="navArrived"></b><button class="btn primary" data-act="nav-done" data-i18n="navDone"></button></div>
    <div id="nav-sim" class="nav-sim" hidden>
      <button data-act="nav-speed" data-v="1">×1</button><button data-act="nav-speed" data-v="5" class="on">×5</button><button data-act="nav-speed" data-v="15">×15</button>
      <button data-act="nav-deviate" data-i18n="navDeviate"></button>
    </div>
    <button id="nav-recenter" class="btn primary nav-recenter" data-act="nav-recenter" hidden data-i18n="navRecenter"></button>
    <div class="nav-bottom">
      <div id="nav-bar"><i></i></div>
      <div class="nav-stats"><div><b id="nav-eta">–</b><small>ETA</small></div><div><b id="nav-min">–</b><small>min</small></div><div><b id="nav-km">–</b><small>left</small></div><div><b id="nav-spd">–</b><small>speed</small></div></div>
      <div class="nav-btns"><button class="icon" id="nav-mute" data-act="nav-mute" aria-label="Voice">🔊</button><button class="btn danger" data-act="nav-end" data-i18n="navEnd"></button></div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
